server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: aerosaga
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aerosaga}
aerosaga:
  temporal:
    enabled: ${TEMPORAL_ENABLED:true}
    target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    task-queue: ${TEMPORAL_TASK_QUEUE:aerosaga-missions}


